name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MobileShop.slnx --nologo

      - name: Build
        run: dotnet build src/MobileShop.slnx --nologo --no-restore

      - name: Test
        run: dotnet test src/MobileShop.slnx --nologo --no-build --no-restore
