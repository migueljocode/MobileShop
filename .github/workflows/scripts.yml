name: Scripts CI

on:
  push:
    branches: [main]
    paths: ['src/MobileShop.Scripts/**', '.github/workflows/scripts.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Log utility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: bash src/MobileShop.Scripts/tests/test-bash.sh
      - shell: pwsh
        run: ./src/MobileShop.Scripts/tests/test-powershell.ps1
