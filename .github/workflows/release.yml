name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark release as a prerelease'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Save release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate and test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate release version and tag availability
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          raw="${RAW_VERSION#"${RAW_VERSION%%[![:space:]]*}"}"
          raw="${raw%"${raw##*[![:space:]]}"}"
          semver="${raw#v}"
          if [[ ! "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$raw'. Expected semantic versioning such as 1.0.0, v1.0.0, or 1.0.0-rc.1."
            exit 1
          fi
          tag="v${semver}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag '${tag}' already exists on origin. Choose a new version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore src/MobileShop.slnx
      - run: dotnet build src/MobileShop.slnx -c Release --no-restore
      - run: dotnet test src/MobileShop.slnx -c Release --no-build

  publish:
    name: Publish and smoke-test (${{ matrix.rid }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            platform: linux
          - rid: osx-arm64
            os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Publish self-contained single-file app (${{ matrix.rid }})
        run: |
          dotnet publish src/MobileShop.Web/MobileShop.Web.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            -p:Version="${{ needs.validate.outputs.semver }}" \
            -p:InformationalVersion="${{ needs.validate.outputs.semver }}+${GITHUB_SHA::7}"

      - name: Verify macOS code signature
        if: matrix.platform == 'macos'
        run: codesign --verify --verbose=2 "Publishes/${{ matrix.rid }}/MobileShop.Web"

      - name: Package release archive
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          RID: ${{ matrix.rid }}
        run: |
          package_name="MobileShop-${TAG}-${RID}"
          stage_dir="${RUNNER_TEMP}/stage"
          dist_dir="${RUNNER_TEMP}/dist"

          rm -rf "$stage_dir" "$dist_dir"
          mkdir -p "$stage_dir" "$dist_dir"

          cp -Rp "Publishes/${RID}" "$stage_dir/$package_name"
          chmod +x "$stage_dir/$package_name/MobileShop.Web"

          COPYFILE_DISABLE=1 tar -C "$stage_dir" -czf "$dist_dir/${package_name}.tar.gz" "$package_name"

      - name: Smoke-test packaged release archive
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          RID: ${{ matrix.rid }}
        run: bash .github/scripts/publish-smoke.sh "${RUNNER_TEMP}/dist/MobileShop-${TAG}-${RID}.tar.gz"

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.rid }}
          path: ${{ runner.temp }}/dist/MobileShop-${{ needs.validate.outputs.tag }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum MobileShop-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          flags=(
            --repo "${{ github.repository }}"
            --target "${{ github.sha }}"
            --title "MobileShop ${TAG}"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$IS_DRAFT" == "true" ]]; then
            flags+=(--draft)
          fi

          gh release create "$TAG" dist/MobileShop-*.tar.gz dist/checksums.txt "${flags[@]}"
